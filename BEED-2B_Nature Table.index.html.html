function openBorrow(){redo=openBorrow;const row=(id,l)=>`<div class="rw"><span>${l}</span><button class="b ${borrowed.has(id)?'x':''}" onclick="borrow('${id}')">${borrowed.has(id)?'Return':'Borrow'}</button></div>`;
modal(`<h2>📚 Borrowing Station</h2><div class="s">Items borrowed: ${borrowed.size}</div><div class="bl">${BOOKS.map((b,i)=>row('b'+i,'📘 '+b[0])).concat(TOP.map((t,i)=>row('t'+i,'📱 Tablet — '+t))).join('')}</div><button class="b x" onclick="closeModal()">Close</button>`)}
function borrow(id){if(borrowed.has(id)){borrowed.delete(id);toast('↩ Returned')}else{borrowed.add(id);toast('✅ Borrowed — enjoy!')}
if(id[0]==='t'){const o=movs.find(o=>o.userData.tab===+id.slice(1));if(o){o.visible=!borrowed.has(id);if(!o.visible&&cur===o)hideInfo()}}redo&&redo()}

// ---- QR ----
function qrOpen(cap){const n=cap.replace('Scan: ','');modal('<h2>📷 Scanning '+n+'…</h2><div class="scan"></div>');const s=mseq;setTimeout(()=>{if(mseq!==s)return;
if(n==='Rock Notes')modal('<h2>📝 Rock Notes</h2>'+Object.keys(RKP).map(k=>`<h3>${k}</h3><ul>${RKP[k].map(x=>'<li>'+x+'</li>').join('')}</ul>`).join('')+'<button class="b" onclick="qrOpen(\'Scan: Videos\')">🎬 Watch videos</button><button class="b x" onclick="closeModal()">Close</button>');
else if(n==='Quizzes')modal('<h2>🧠 Quizzes</h2><div class="s">Pick a topic — it opens on a tablet.</div>'+TOP.map((t,i)=>`<button class="o" onclick="openTablet(${i});quiz(${i})">🪨 ${t} Quiz</button>`).join('')+'<button class="b x" onclick="closeModal()">Close</button>');
else vModal(0)},900)}
function vModal(i){modal(`<h2>🎬 Learning Videos</h2><div id="vb"></div>`+VID.map((v,j)=>`<button class="b ${j===i?'':'x'}" onclick="vModal(${j})">${v[0]}</button>`).join('')+'<br><button class="b x" onclick="closeModal()">Close</button>');player($('vb'),i)}

// ---- tablet ----
function openTablet(i){TB={i,st:[]};modal(`<div class="tb"><div class="tbs"><span>📱 ${TOP[i]} Tablet</span><span>${wifi?'📶':'✖'} 🔋 87%</span></div><div class="tc" id="tc"></div><div class="tn"><button onclick="tBack()">◀ Back</button><button onclick="tHome()">⬤ Home</button><button onclick="closeModal()">✕ Close</button></div></div>`,'tbm');tHome()}
function tGo(f){TB.st.push(f);f()}
function tBack(){if(TB.st.length>1){TB.st.pop();TB.st[TB.st.length-1]()}else toast('Already on the Home screen')}
function tHome(){TB.st=[tHomeV];tHomeV()}
function tHomeV(){$('tc').innerHTML=`<h3>Welcome! Topic: ${TOP[TB.i]}</h3><div class="ap">${[['🪨','Rock Quiz'],['🎬','Videos'],['📚','Learn'],['🃏','Flashcards']].map((a,n)=>`<button class="ic" onclick="tApp(${n})"><span>${a[0]}</span>${a[1]}</button>`).join('')}</div>`}
function tApp(n){[()=>quiz(TB.i),()=>tGo(tVideos),()=>tGo(tLearn),()=>tGo(tCards)][n]()}
function tVideos(){$('tc').innerHTML='<h3>🎬 Videos</h3>'+VID.map((v,i)=>`<button class="o" onclick="tGo(()=>tPlay(${i}))">▶ ${v[0]}</button>`).join('')}
function tPlay(i){$('tc').innerHTML=`<h3>🎬 ${VID[i][0]}</h3><div id="vb"></div><p>${VID[i][1]}</p>`;player($('vb'),i)}
function tLearn(){$('tc').innerHTML='<h3>📚 Learning Materials</h3>'+TOP.map((t,i)=>`<button class="o" onclick="tGo(()=>tFact(${i}))">${t}</button>`).join('')}
function tFact(i){$('tc').innerHTML=`<h3>${TOP[i]}</h3><p class="rd">${FACT[i]}</p><button class="b" onclick="quiz(${Math.min(i,5)})">🧠 Take the quiz</button>`}
function tCards(){TB.c=TB.c||{i:0,f:0};const{i,f}=TB.c;$('tc').innerHTML=`<h3>🃏 Flashcards (${i+1}/6)</h3><div class="fc" style="background:${TC[i]}" onclick="TB.c.f=!TB.c.f;tCards()">${f?FACT[i]:'<b>'+TOP[i]+'</b><br><small>tap to flip</small>'}</div><button class="b" onclick="TB.c={i:(TB.c.i+1)%6,f:0};tCards()">Next ▶</button>`}
function quiz(i){TB.q={n:0,s:0,i};tGo(qView)}
function qView(){const{n,s,i}=TB.q,q=Q[(i+n)%Q.length],c=$('tc');c.innerHTML=`<h3>🪨 ${TOP[i]} Quiz</h3><div class="s">Question ${n+1} of 3 · Score ${s}</div><div class="q">${q[0]}</div>`+q[1].map((o,j)=>`<button class="o" data-i="${j}">${o}</button>`).join('')+'<div class="f"></div>';
c.querySelectorAll('.o').forEach(b=>b.onclick=()=>{const ok=+b.dataset.i===q[2];c.querySelectorAll('.o').forEach(x=>{x.disabled=true;if(+x.dataset.i===q[2])x.classList.add('ok')});if(ok)TB.q.s++;else b.classList.add('no');
c.querySelector('.f').innerHTML=(ok?'✅ Correct! ':'❌ Not quite. ')+q[3]+'<br><br><button class="b" id="nx">'+(n<2?'Next →':'Finish')+'</button>';c.querySelector('.s').textContent=`Question ${n+1} of 3 · Score ${TB.q.s}`;
$('nx').onclick=()=>{TB.q.n++;TB.q.n<3?qView():qEnd()}})}
function qEnd(){const{s,i}=TB.q;$('tc').innerHTML=`<h3>🎉 Quiz complete!</h3><div class="q">You scored ${s} out of 3.</div><p>${s==3?'Perfect — you are a rock star!':s>=2?'Great job, keep exploring!':'Good try! Practise again.'}</p><button class="b" onclick="quiz(${i})">↻ Try again</button><button class="b" onclick="quiz(${(i+1)%6})">Next topic →</button><button class="b x" onclick="tHome()">Home</button>`}

// ---- selection / info ----
const rc=new THREE.Raycaster(),m2=new THREE.Vector2(),pl=new THREE.Plane(new THREE.Vector3(0,1,0),0),pt=new V3(),off=new V3(),pops=[],blk=room.children.filter(m=>m.isMesh&&m.geometry.type==='BoxGeometry'&&m.geometry.parameters.height>=5.9),pkl=clk.concat(blk);
let cur=null,sel=null,drag=0,mv=0,sx=0,sy=0,cand=null,bh=null,lastHov=0;
function ray(e){const r=dom.getBoundingClientRect();m2.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);rc.setFromCamera(m2,cam)}
function pick(){const h=rc.intersectObjects(pkl,true);for(const x of h){if(blk.includes(x.object))return null;let ok=1;for(let p=x.object;p;p=p.parent)if(!p.visible){ok=0;break}if(ok)return x}return null}
function own(o){for(;o;o=o.parent){const u=o.userData;if(u.pwr||u.scr||u.bk!==undefined||u.qr||u.kind)return o}return null}
function select(o){if(bh)scene.remove(bh);bh=new THREE.BoxHelper(o,0xffe066);scene.add(bh);showInfo(o)}
function hideInfo(){$('info').style.display='none';cur=null;if(bh){scene.remove(bh);bh=null}}
function refresh(){if(cur&&$('info').style.display==='block')showInfo(cur)}
function showInfo(o){cur=o;const u=o.userData,k=u.kind,I=INFO[k]||INFO.obj;let b='',st='';
if(u.mov)b+='<button onclick="rotSel(-45)">⟲ Rotate</button><button onclick="rotSel(45)">⟳ Rotate</button><button onclick="putBack()">↺ Put back</button>';
if(k==='pc'){const P=u.P;st='Power: <b>'+({off:'OFF',on:'ON',boot:'Booting…',shut:'Shutting down…'})[P.st]+'</b>';b+=`<button onclick="power(cur.userData.P)">⏻ ${P.st==='off'?'Turn ON':'Turn OFF'}</button><button onclick="focusPC(cur.userData.P)">🔍 Zoom to screen</button>`}
if(k==='tablet')b+=`<button onclick="openTablet(cur.userData.tab)">📱 Open tablet</button>`;
if(k==='router'){st='Wi-Fi: <b>'+(wifi?'ON':'OFF')+'</b>';b+='<button onclick="toggleWifi()">📶 Toggle Wi-Fi</button>'}
if(k==='projector'||k==='board'){st='Projector: <b>'+(PJ.on?'ON':'OFF')+'</b>';b+=`<button onclick="projector()">⏻ ${PJ.on?'Turn OFF':'Turn ON'}</button><button onclick="slide(-1)">◀ Prev</button><button onclick="slide(1)">Next ▶</button><button onclick="go('pj')">🎥 View</button>`}
if(k==='plant')b+='<button onclick="water(cur)">💧 Water</button>';
if(k==='shelf')st='Tip: click a book to read it.';
$('info').innerHTML=`<span class="x" onclick="hideInfo()">✕</span><b>${I[3]} ${I[0]}</b><p>${I[1]}</p><p><i>Purpose:</i> ${I[2]}</p>${st?'<p>'+st+'</p>':''}<div>${b}</div>`;$('info').style.display='block'}
function pop(o){const u=o.userData;if(u.pk!==undefined)return;u.pk=0;u.by=o.position.y;u.bs=o.scale.x;pops.push(o)}
function water(o){pop(o);toast('💧 Plant watered — it looks happier!')}
function rotSel(d){if(!cur||!cur.userData.mov){toast('Select a movable object first (chairs, robots, rocks, tablets…)');return}const u=cur.userData;u.rt=(u.rt!==undefined?u.rt:cur.rotation.y)+d*Math.PI/180}
function putBack(){const o=cur;if(!o||!o.userData.p0)return;const u=o.userData;o.position.copy(u.p0);o.rotation.y=u.r0;u.rt=u.ty=undefined;pop(o);if(bh)bh.update()}
function settle(o){const w=o.getWorldPosition(new V3());o.traverse(c=>c.layers.set(1));const h=new THREE.Raycaster(new V3(w.x,w.y+.2,w.z),new V3(0,-1,0),0,30).intersectObjects(room.children,true);o.traverse(c=>c.layers.set(0));o.userData.ty=h.length?h[0].point.y-room.position.y:.1}
function act(x){if(!x){hideInfo();return}const o=own(x.object),u=o.userData;
if(u.pwr)return power(u.pwr);if(u.scr)return scrClick(u.scr,x);if(u.bk!==undefined)return bookOpen(u.bk,o);if(u.qr)return qrOpen(u.qr);
const k=u.kind;if(k==='pscreen')return slide(1);if(k==='borrow'){select(o);return openBorrow()}if(k==='switch'){select(o);return toggleLights()}
select(o);pop(o);if(u.tab!==undefined)openTablet(u.tab)}
dom.addEventListener('pointerdown',e=>{if(e.button)return;ray(e);const x=pick();sx=e.clientX;sy=e.clientY;mv=0;cand=x;drag=0;sel=null;const o=x&&own(x.object);
if(o&&o.userData.mov){sel=o;drag=1;ctl.enabled=false;goal=null;pl.constant=-x.point.y;off.set(x.point.x-o.position.x,0,x.point.z-o.position.z)}},true);
addEventListener('pointermove',e=>{ray(e);const s=rc.intersectObjects(scrs);if(!drag&&s.length){const P=s[0].object.userData.scr;if(P.st==='on'){P.cur={x:s[0].uv.x*640,y:(1-s[0].uv.y)*360};P.dirty=1;dom.style.cursor='none';return}}
if(drag&&sel){mv=Math.hypot(e.clientX-sx,e.clientY-sy);if(mv>5&&rc.ray.intersectPlane(pl,pt)){const u=sel.userData;if(!u.lifted){u.lifted=1;sel.position.y+=.3;u.ty=undefined;select(sel)}sel.position.x=Math.max(-19.5,Math.min(19.5,pt.x-off.x));sel.position.z=Math.max(-9.5,Math.min(9.8,pt.z-off.z));if(bh)bh.update()}return}
const n=performance.now();if(n-lastHov<50||e.target!==dom)return;lastHov=n;const x=pick(),o=x&&own(x.object);dom.style.cursor=o?(o.userData.mov?'grab':'pointer'):'default'});
addEventListener('pointerup',e=>{if(drag&&sel){const u=sel.userData;if(u.lifted){u.lifted=0;if(mv>5)settle(sel);else sel.position.y-=.3}drag=0;ctl.enabled=true}
if(mv<6&&cand!==undefined&&e.target===dom&&e.button===0&&cand!==false)act(cand);cand=false;mv=99},true);
cand=false;
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;const k=e.key.toLowerCase(),md=$('mod').style.display==='flex';
if(k==='escape')md?closeModal():hideInfo();else if(md)return;else if(k==='q')rotSel(-45);else if(k==='e')rotSel(45);else if(k==='arrowright'&&PJ.on)slide(1);else if(k==='arrowleft'&&PJ.on)slide(-1);else if(k==='f')goFull();else if(k==='l')toggleLights()});

function resetAll(){closeModal();hideInfo();movs.forEach(o=>{const u=o.userData;o.position.copy(u.p0);o.rotation.y=u.r0;o.scale.setScalar(u.s0);o.visible=true;u.rt=u.ty=u.pk=undefined;u.lifted=0});pops.length=0;
PCS.forEach(P=>{P.st=P.init;P.app=null;P.menu=0;P.fs=null;P.ff=null;P.rq=0;P.rs=0;P.ra=-1;P.pg=0;P.dirty=1;setLeds(P)});
PJ.on=0;PJ.s=0;wifi=1;mat('#3f3').color.set('#33ff33');borrowed.clear();L.on=1;L.day=1;L.br=1;$('br').value=100;upd();updRemote();go('ov');toast('♻ Classroom reset')}
upd();updRemote();PCS.forEach(setLeds);setTimeout(help,300);

addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});
const clock=new THREE.Clock();let tt=0;
(function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.1),n=performance.now();tt+=dt;
if(goal){cam.position.lerp(goal.p,.08);ctl.target.lerp(goal.t,.08);if(cam.position.distanceTo(goal.p)<.05)goal=null}
env(dt,tt);
for(let i=pops.length-1;i>=0;i--){const o=pops[i],u=o.userData;u.pk+=dt/.5;if(u.pk>=1){o.scale.setScalar(u.bs);o.position.y=u.by;u.pk=undefined;pops.splice(i,1)}else{const s=Math.sin(Math.PI*u.pk);o.scale.setScalar(u.bs*(1+(BIG.has(u.kind)?.02:.12)*s));o.position.y=u.by+(HOP[u.kind]||0)*s}}
movs.forEach(o=>{const u=o.userData;if(u.rt!==undefined){o.rotation.y+=(u.rt-o.rotation.y)*Math.min(1,dt*10);if(Math.abs(u.rt-o.rotation.y)<.004){o.rotation.y=u.rt;u.rt=undefined}}
if(u.ty!==undefined&&u.pk===undefined&&!u.lifted){o.position.y+=(u.ty-o.position.y)*Math.min(1,dt*9);if(Math.abs(u.ty-o.position.y)<.005){o.position.y=u.ty;u.ty=undefined}}});
PCS.forEach(P=>{if(P.app==='vd'&&P.play&&P.st==='on'){P.vt=(P.vt+dt)%VD;P.dirty=1}const tr=P.st==='boot'||P.st==='shut';
if(P.dirty||tr||(P.st==='on'&&n-P.last>1000)){const was=P.st;P.dirty=0;drawPC(P);P.tex.needsUpdate=true;if(was!==P.st)refresh()}});
ctl.update();if(bh)bh.update();ren.render(scene,cam)})();
</script></body></html>
